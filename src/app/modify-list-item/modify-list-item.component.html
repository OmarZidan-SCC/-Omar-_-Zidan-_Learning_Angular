<div class="form-container">
  <form [formGroup]="blogForm" (ngSubmit)="onSubmit()" class="mat-form">
    <h2>{{ isEditing ? 'Edit Blog Post' : 'Create New Blog Post' }}</h2>

    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" matTooltip="Enter the main title for your blog post.">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Author</mat-label>
      <input matInput formControlName="author" matTooltip="The name of the person who wrote the post.">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Content</mat-label>
      <textarea matInput formControlName="content" rows="5" matTooltip="Write the main body of your post here."></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Image URL</mat-label>
      <input matInput formControlName="imageUrl" matTooltip="An optional URL for a post image.">
    </mat-form-field>

    <div class="form-actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="blogForm.invalid">
        {{ isEditing ? 'Update Post' : 'Add Post' }}
      </button>
      <button mat-button type="button" (click)="navigateToBlogList()">Back to List</button>
    </div>
  </form>
</div>
