<div class="form-container">

  <h2>{{ isEditing ? 'Edit Blog Post' : 'Create New Blog Post' }}</h2>

  <form [formGroup]="blogForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="id">ID</label>
      <input id="id" type="number" formControlName="id" [appHighlightOnFocus]="'#b1d2f2'">
    </div>

    <div class="form-group">
      <label for="title">Title</label>
      <input id="title" type="text" formControlName="title" [appHighlightOnFocus]="'#b1d2f2'">
    </div>

    <div class="form-group">
      <label for="author">Author</label>
      <input id="author" type="text" formControlName="author" [appHighlightOnFocus]="'#b1d2f2'">
      <div *ngIf="blogForm.get('author')?.touched && blogForm.get('author')?.invalid" class="error">
        Author is required.
      </div>
    </div>

    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" formControlName="content" rows="5" [appHighlightOnFocus]="'#b1d2f2'"></textarea>
      <div *ngIf="blogForm.get('content')?.touched && blogForm.get('content')?.invalid" class="error">
        Content is required.
      </div>
    </div>

    <div class="form-group">
      <label for="imageUrl">Image URL</label>
      <input id="imageUrl" type="text" formControlName="imageUrl">
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="blogForm.invalid">
        {{ isEditing ? 'Update Post' : 'Add Post' }}
      </button>

      <button type="button" (click)="onDelete()">Delete</button>

      <button type="button" (click)="navigateToBlogList()">Back to List</button>
    </div>
  </form>
  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>
</div>
