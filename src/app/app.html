<div class="container">
  <h2>Blog Posts</h2>
  <div *ngFor="let post of blogPostList" class="blog-card">
    <h3>{{ post.title }}</h3>
    <p>{{ post.content }}</p>
    <p>Author: {{ post.author }}</p>
    <p>Published: {{ post.published ? 'Yes' : 'No' }}</p>
    <button (click)="togglePublished(post)" class="toggle-button">
      Toggle Published
    </button>
  </div>
</div>
