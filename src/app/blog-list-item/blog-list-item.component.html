<mat-card class="blog-card" *ngIf="post">
  <mat-card-header>
    <mat-card-title>{{ post.title }}</mat-card-title>
    <mat-card-subtitle>{{ post.author | uppercase }} | {{ post.publishDate | date:'mediumDate' }}</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-image [src]="post.imageUrl" [alt]="'Image for ' + post.title">
  <mat-card-content>
    <p>{{ post.content }}</p>
    <p>Sponsorship: <span>{{ post.sponsorship | currency:'USD' }}</span></p>
  </mat-card-content>


  <mat-divider></mat-divider>

  <mat-card-actions align="end">

    <button mat-icon-button (click)="editPost()" matTooltip="Edit Post">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button (click)="deletePost()" matTooltip="Delete Post">
      <mat-icon>delete</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
